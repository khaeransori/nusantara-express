:root {
  --bg: #e9f3f2; --surface: #f8fcfb; --ink: #241a2c; --muted: #585469; --line: #c3d9d7;
  --accent: #1d6aab; --sun: #f7a23b; --sun-ink: #9a520c;
  --stage: #d6eef1; --stage2: #c8e6ea; --topbar: rgba(233, 243, 242, .9);
  /* game UI colors: fixed, the game has one look in both themes */
  --g-ink: #2b1d2e; --g-paper: #fffaf0; --g-cream: #fff0c2; --g-orange: #f7a23b; --g-orange-d: #d4721f;
  --g-red: #e2463b; --g-red-d: #a8313a; --g-sea: #2d82c9; --g-sky: #52bde8; --g-sand: #f3dc9b; --g-sand-d: #d9b766;
  --g-green: #5fbf48; --g-green-d: #2f8f45; --g-gold: #ffcc33;
  --f-pixel: "Pixelify Sans", ui-monospace, "Courier New", monospace;
  --f-body: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --f-code: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1a2a; --surface: #13233a; --ink: #f1ebe0; --muted: #a6b0c0; --line: #243852;
  --accent: #6cc0f0; --sun: #ffb04d; --sun-ink: #ffc97a;
  --stage: #19304d; --stage2: #1c3553; --topbar: rgba(14, 26, 42, .9); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1a2a; --surface: #13233a; --ink: #f1ebe0; --muted: #a6b0c0; --line: #243852;
  --accent: #6cc0f0; --sun: #ffb04d; --sun-ink: #ffc97a;
  --stage: #19304d; --stage2: #1c3553; --topbar: rgba(14, 26, 42, .9); color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--f-body); }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; }
canvas.spr, #hero, #map { image-rendering: pixelated; image-rendering: crisp-edges; display: block; max-width: 100%; height: auto; }
h1, h2, h3, h4 { font-family: var(--f-pixel); text-wrap: balance; margin: 0; line-height: 1.1; }
p { margin: 0; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--topbar); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font: 700 18px/1.1 var(--f-pixel); }
.brand span { font-size: 13px; color: var(--muted); }
.langs { display: flex; align-items: center; gap: 8px; }
.langs .lbl { font-size: 13px; color: var(--muted); }

/* game-styled controls (shared by top bar and UI kit) */
.gbtn, .gseg button {
  font: 700 16px/1 var(--f-pixel); color: var(--g-ink); border: 0; cursor: pointer; padding: 10px 16px 13px;
  background: var(--g-paper);
  box-shadow: 0 -3px 0 0 var(--g-ink), 0 3px 0 0 var(--g-ink), -3px 0 0 0 var(--g-ink), 3px 0 0 0 var(--g-ink), inset 0 -4px 0 0 #d6cdc4;
  transition: transform .06s;
}
.gbtn:active, .gseg button:active { transform: translateY(2px); box-shadow: 0 -3px 0 0 var(--g-ink), 0 3px 0 0 var(--g-ink), -3px 0 0 0 var(--g-ink), 3px 0 0 0 var(--g-ink), inset 0 -1px 0 0 #d6cdc4; }
.gbtn:focus-visible, .gseg button:focus-visible { outline: 3px dashed var(--accent); outline-offset: 6px; }
.gbtn.primary { background: var(--g-orange); box-shadow: 0 -3px 0 0 var(--g-ink), 0 3px 0 0 var(--g-ink), -3px 0 0 0 var(--g-ink), 3px 0 0 0 var(--g-ink), inset 0 -4px 0 0 var(--g-orange-d), inset 0 3px 0 0 rgba(255,255,255,.35); font-size: 20px; padding: 12px 22px 15px; }
.gbtn.sea { background: var(--g-sky); box-shadow: 0 -3px 0 0 var(--g-ink), 0 3px 0 0 var(--g-ink), -3px 0 0 0 var(--g-ink), 3px 0 0 0 var(--g-ink), inset 0 -4px 0 0 var(--g-sea); }
.gseg { display: flex; gap: 3px; margin: 3px; }
.gseg button { padding: 7px 10px 10px; font-size: 15px; }
.gseg button[aria-pressed="true"] { background: var(--g-orange); box-shadow: 0 -3px 0 0 var(--g-ink), 0 3px 0 0 var(--g-ink), -3px 0 0 0 var(--g-ink), 3px 0 0 0 var(--g-ink), inset 0 -4px 0 0 var(--g-orange-d); }

/* hero */
.hero { position: relative; margin-top: 20px; background: var(--g-ink); padding: 4px; }
.hero canvas { width: 100%; aspect-ratio: 2 / 1; }
.hero-title { position: absolute; left: 4%; top: 7%; max-width: 56%; display: flex; flex-direction: column; gap: 10px; }
.hero h1 { font-weight: 700; font-size: clamp(26px, 7.2vw, 76px); letter-spacing: .01em; line-height: .95; display: flex; flex-direction: column; }
.hero h1 span { color: var(--g-orange); --o: clamp(2px, .45vw, 4px);
  text-shadow: var(--o) 0 0 var(--g-ink), calc(var(--o) * -1) 0 0 var(--g-ink), 0 var(--o) 0 var(--g-ink), 0 calc(var(--o) * -1) 0 var(--g-ink),
    var(--o) var(--o) 0 var(--g-ink), calc(var(--o) * -1) var(--o) 0 var(--g-ink), var(--o) calc(var(--o) * -1) 0 var(--g-ink), calc(var(--o) * -1) calc(var(--o) * -1) 0 var(--g-ink),
    0 calc(var(--o) * 2.5) 0 var(--g-ink); }
.hero h1 span + span { color: var(--g-paper); }
.tagline { font: 500 clamp(11px, 1.9vw, 19px)/1.25 var(--f-pixel); background: var(--g-cream); color: var(--g-ink); padding: 6px 10px 8px; align-self: flex-start;
  box-shadow: 0 -3px 0 0 var(--g-ink), 0 3px 0 0 var(--g-ink), -3px 0 0 0 var(--g-ink), 3px 0 0 0 var(--g-ink); margin: 3px; }
.lede { margin-top: 20px; display: grid; gap: 8px; max-width: 68ch; }
.lede .note { font-size: 19px; font-weight: 700; }
.lede p:last-child { color: var(--muted); }

/* sections */
section.sec { padding-block: 44px 8px; }
.sec-head { display: grid; gap: 6px; margin-bottom: 20px; max-width: 68ch; }
.sec-head h2 { font-size: clamp(26px, 4vw, 34px); font-weight: 700; }

      NX.draw(mapCtx, SPR.mapPin, Math.round(x) - 3, Math.round(y) - 7 - lift, 1);
    });
    const k = Math.floor((f * 1.2) % 240);
    const idx = Math.min(route.length - 1, k);
    const [px, py] = route[idx];
    NX.draw(mapCtx, SPR.miniPlane, Math.round(px) - 7, Math.round(py) - 5, 1);
  }

  /* ---------- small animations ---------- */
  function animated() {
    const oy = document.getElementById('oyen-big');
    const cap = document.getElementById('capung');
    const pin = document.getElementById('pinisi');
    const mk = (el, w, h, scale) => { const c = document.createElement('canvas'); c.width = w; c.height = h; c.style.width = w * scale + 'px'; c.className = 'spr'; c.setAttribute('aria-hidden', 'true'); el.appendChild(c); return c.getContext('2d'); };
    const oc = mk(oy, 24, 24, 8), cc = mk(cap, 40, 25, 5), pc = mk(pin, 50, 38, 4);
    return f => {
      oc.clearRect(0, 0, 24, 24); NX.draw(oc, f % 30 === 29 ? SPR.oyenBlink : SPR.oyen, 0, 0, 1);
      cc.clearRect(0, 0, 40, 25); NX.draw(cc, SPR.capung[f % 2], 0, Math.round(Math.sin(f / 5)), 1);
      pc.clearRect(0, 0, 50, 38); NX.draw(pc, SPR.pinisi, 0, 1 + (Math.floor(f / 4) % 2), 1);
    };
  }

  function boot() {
    applyLang(lang);
    fillSprites(document);
    heroCanvas = document.getElementById('hero');
    heroCtx = heroCanvas.getContext('2d');
    heroBg = offscreen(heroBase());
    const mc = document.getElementById('map');
    mapCtx = mc.getContext('2d');
    mapBg = offscreen(mapBase());
    const small = animated();
    let f = 0;
    const tick = () => { drawHero(f); drawMap(f); small(f); f++; };
    tick();
    if (reduce) return;
    let last = 0;
    const loop = ts => { if (ts - last > 125) { last = ts; tick(); } requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(NX);

</script>
